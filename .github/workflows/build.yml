name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2
      - name: Unzip project (if it was uploaded as a zip) and find it
        id: find
        run: |
          mkdir -p _src
          find . -maxdepth 3 -iname "*.zip" -not -path "./_src/*" -not -path "./.git/*" | while read -r z; do
            echo "Unzipping $z"
            unzip -oq "$z" -d _src
          done
          f=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle not found (not in the repo and not inside any zip)."
            ls -R | head -60
            exit 1
          fi
          echo "Project folder: $(dirname "$f")"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          
